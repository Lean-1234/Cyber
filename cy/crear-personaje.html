<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERPUNK RPG - CREACIÓN DE PERSONAJE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #050508; font-family: 'Rajdhani', sans-serif; color: #e2e8f0; }
    .font-title { font-family: 'Orbitron', sans-serif; }
    .cyber-box { background: rgba(10, 15, 25, 0.9); border: 1px solid rgba(0, 243, 255, 0.3); }
    .cyber-input { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 243, 255, 0.4); color: #00f3ff; }
    .cyber-input:focus { border-color: #fcee0a; outline: none; }
    .cyber-btn { background: #00f3ff; color: #000; font-family: 'Orbitron', sans-serif; font-weight: 700; transition: all 0.2s; }
    .cyber-btn:hover { background: #fcee0a; box-shadow: 0 0 15px rgba(252, 238, 10, 0.5); }
    .cyber-btn-alt { background: transparent; border: 1px solid #ff9900; color: #ff9900; font-family: 'Orbitron', sans-serif; font-weight: 700; }
    .cyber-btn-alt:hover { background: rgba(255, 153, 0, 0.1); box-shadow: 0 0 15px rgba(255, 153, 0, 0.3); }
  </style>
</head>
<body class="p-6 min-h-screen flex flex-col justify-between">

  <!-- BARRA SUPERIOR -->
  <header class="cyber-box px-6 py-4 rounded-lg flex justify-between items-center mb-6">
    <div>
      <span class="text-xs text-cyan-400 font-mono block">NET_PROTOCOL // CARACTERÍSTICAS</span>
      <h1 class="font-title text-xl text-cyan-400 font-bold">NUEVO EDGERUNNER</h1>
    </div>
    <a href="index.html" class="border border-cyan-500/50 text-cyan-400 px-4 py-2 text-xs font-title rounded hover:bg-cyan-950/40">[ &lt; VOLVER AL HUB ]</a>
  </header>

  <!-- CONTENIDO CENTRAL -->
  <main class="max-w-4xl mx-auto w-full cyber-box p-8 rounded-lg space-y-6">
    <h2 class="font-title text-lg text-cyan-400 border-b border-cyan-500/30 pb-2">// REGISTRO DE IDENTIDAD BIOMÉTRICA</h2>
    
    <form id="form-crear-personaje" onsubmit="registrarPersonaje(event)" class="space-y-6">
      
      <!-- DATOS BÁSICOS -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-title text-gray-400 mb-1">ALIAS / NOMBRE</label>
          <input type="text" id="alias" required class="cyber-input w-full p-3 rounded text-sm" placeholder="Ej: V, Silverhand">
        </div>
        <div>
          <label class="block text-xs font-title text-gray-400 mb-1">CLASE / ROL</label>
          <select id="clase" class="cyber-input w-full p-3 rounded text-sm font-mono">
            <option value="Solo">Solo (Mercenario)</option>
            <option value="Netrunner">Netrunner</option>
            <option value="Techie">Techie</option>
            <option value="Nomad">Nomad</option>
            <option value="Rockerboy">Rockerboy</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-title text-gray-400 mb-1">ORIGEN / TRASFONDO</label>
          <input type="text" id="origen" class="cyber-input w-full p-3 rounded text-sm" placeholder="Ej: Calles de Night City">
        </div>
      </div>

      <!-- ESTADÍSTICAS Y ATRIBUTOS -->
      <div>
        <h3 class="font-title text-sm text-orange-400 mb-3 tracking-wider">// ATRIBUTOS PRINCIPALES (1 - 10)</h3>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 bg-black/50 p-4 rounded border border-orange-500/20 font-mono text-xs">
          <div>
            <label class="block text-gray-400 mb-1">INTELIGENCIA</label>
            <input type="number" id="inteligencia" value="5" min="1" max="10" class="cyber-input w-full p-2 rounded text-center">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">REFLEJOS</label>
            <input type="number" id="reflejos" value="5" min="1" max="10" class="cyber-input w-full p-2 rounded text-center">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">DESTREZA</label>
            <input type="number" id="destreza" value="5" min="1" max="10" class="cyber-input w-full p-2 rounded text-center">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">TÉCNICA</label>
            <input type="number" id="tecnica" value="5" min="1" max="10" class="cyber-input w-full p-2 rounded text-center">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">COOL</label>
            <input type="number" id="cool" value="5" min="1" max="10" class="cyber-input w-full p-2 rounded text-center">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">ATRACTIVO</label>
            <input type="number" id="atractivo" value="5" min="1" max="10" class="cyber-input w-full p-2 rounded text-center">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">SUERTE</label>
            <input type="number" id="suerte" value="5" min="1" max="10" class="cyber-input w-full p-2 rounded text-center">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">MOVIMIENTO</label>
            <input type="number" id="movimiento" value="5" min="1" max="10" class="cyber-input w-full p-2 rounded text-center">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">CUERPO</label>
            <input type="number" id="cuerpo" value="5" min="1" max="10" class="cyber-input w-full p-2 rounded text-center">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">EMPATÍA</label>
            <input type="number" id="empatia" value="5" min="1" max="10" class="cyber-input w-full p-2 rounded text-center">
          </div>
        </div>
      </div>

      <button type="submit" class="cyber-btn w-full py-3 rounded text-sm tracking-widest mt-4">REGISTRAR Y GUARDAR PERSONAJE</button>
    </form>
  </main>

  <footer class="text-center text-xs text-gray-600 font-mono mt-8">
    CHARACTER CREATION PROTOCOL // CYBERPUNK RPG
  </footer>

  <script>
    let usuarioActual = null;

    window.addEventListener('DOMContentLoaded', () => {
      const stored = localStorage.getItem('usuario');
      if (!stored) {
        window.location.href = 'login.html';
        return;
      }
      usuarioActual = JSON.parse(stored);
    });

    async function registrarPersonaje(e) {
      e.preventDefault();
      
      const payload = {
        usuario_id: usuarioActual.id,
        alias: document.getElementById('alias').value.trim(),
        clase: document.getElementById('clase').value,
        origen: document.getElementById('origen').value.trim() || 'Desconocido',
        inteligencia: parseInt(document.getElementById('inteligencia').value),
        reflejos: parseInt(document.getElementById('reflejos').value),
        destreza: parseInt(document.getElementById('destreza').value),
        tecnica: parseInt(document.getElementById('tecnica').value),
        cool: parseInt(document.getElementById('cool').value),
        atractivo: parseInt(document.getElementById('atractivo').value),
        suerte: parseInt(document.getElementById('suerte').value),
        movimiento: parseInt(document.getElementById('movimiento').value),
        cuerpo: parseInt(document.getElementById('cuerpo').value),
        empatia: parseInt(document.getElementById('empatia').value),
        hp_max: 30 + (parseInt(document.getElementById('cuerpo').value) * 2),
        hp_actual: 30 + (parseInt(document.getElementById('cuerpo').value) * 2)
      };

      try {
        const res = await fetch(`${window.location.origin}/api/personajes/crear`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok) {
          alert("¡Personaje creado y guardado en la base de datos con éxito!");
          window.location.href = 'index.html';
        } else {
          alert(data.message || "Error al crear personaje.");
        }
      } catch (err) {
        alert("Error de conexión con el servidor central.");
      }
    }
  </script>
</body>
</html>
