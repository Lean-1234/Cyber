<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERPUNK RPG - PANEL GM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #050508; font-family: 'Rajdhani', sans-serif; color: #e2e8f0; }
    .font-title { font-family: 'Orbitron', sans-serif; }
    .cyber-box { background: rgba(10, 15, 25, 0.9); border: 1px solid rgba(255, 153, 0, 0.4); }
  </style>
</head>
<body class="p-6 min-h-screen flex flex-col justify-between">

  <header class="cyber-box px-6 py-4 rounded-lg flex justify-between items-center mb-6">
    <div>
      <span class="text-xs text-orange-400 font-mono block">MODO GAME MASTER ACTIVO</span>
      <h1 class="font-title text-xl text-orange-400 font-bold">SALA CÓDIGO: <span id="display-codigo" class="text-white tracking-widest">----</span></h1>
    </div>
    <a href="index.html" class="border border-cyan-500/50 text-cyan-400 px-4 py-2 text-xs font-title rounded hover:bg-cyan-950/40">[ &lt; VOLVER AL HUB ]</a>
  </header>

  <main class="max-w-5xl mx-auto w-full my-auto space-y-6">
    <div class="cyber-box p-6 rounded-lg">
      <h2 class="font-title text-sm text-orange-400 mb-4 tracking-wider">// JUGADORES CONECTADOS EN TIEMPO REAL</h2>
      
      <div id="lista-jugadores" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="p-4 bg-black/50 border border-gray-800 rounded font-mono text-xs text-gray-500">
          Esperando conexiones de netrunners...
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-xs text-gray-600 font-mono mt-8">
    GM SURVEILLANCE PROTOCOL // CYBERPUNK RPG
  </footer>

  <script>
    let salaId = localStorage.getItem('sala_gm_id');
    let codigoSala = localStorage.getItem('sala_gm_codigo');

    window.addEventListener('DOMContentLoaded', () => {
      if (!salaId || !codigoSala) {
        alert("No hay una sala activa de GM registrada.");
        window.location.href = 'index.html';
        return;
      }
      document.getElementById('display-codigo').textContent = codigoSala;
      
      obtenerJugadores();
      setInterval(obtenerJugadores, 3000);
    });

    async function obtenerJugadores() {
      try {
        const res = await fetch(`${window.location.origin}/api/salas/${salaId}/jugadores`);
        const data = await res.json();
        const contenedor = document.getElementById('lista-jugadores');

        if (data.status === 'success' && data.jugadores.length > 0) {
          contenedor.innerHTML = data.jugadores.map(j => `
            <div class="p-4 bg-black/60 border border-cyan-500/30 rounded flex justify-between items-center">
              <div>
                <span class="text-xs text-orange-400 font-mono block">JUGADOR: ${j.username.toUpperCase()}</span>
                <h3 class="font-title text-cyan-300 text-sm font-bold">${j.alias}</h3>
                <span class="text-xs text-gray-400 font-mono">CLASE: ${j.clase}</span>
              </div>
              <div class="text-right font-mono text-xs">
                <span class="text-green-400 font-bold block">HP: ${j.hp_actual} / ${j.hp_max}</span>
              </div>
            </div>
          `).join('');
        } else {
          contenedor.innerHTML = `
            <div class="p-4 bg-black/50 border border-gray-800 rounded font-mono text-xs text-gray-500">
              Ningún jugador conectado todavía. Comparte tu enlace de ngrok y tu código de sala (<span class="text-orange-400 font-bold">${codigoSala}</span>).
            </div>`;
        }
      } catch (err) {
        console.error("Error al actualizar jugadores", err);
      }
    }
  </script>
</body>
</html>
