<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERPUNK RPG - ACCESS PORTAL</title>
  
  <!-- Tailwind CSS via CDN para utilidades rápidas -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fuentes Sci-Fi / Cyberpunk desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:ital,wght@0,500;0,700;1,600&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    /* Estilos Neón Cyberpunk y Variables */
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff0055;
      --neon-yellow: #fcee0a;
      --cyber-bg: #090a10;
      --card-bg: rgba(14, 18, 28, 0.85);
    }

    body {
      background-color: var(--cyber-bg);
      font-family: 'Rajdhani', sans-serif;
      color: #e2e8f0;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 60%),
        linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 243, 255, 0.02) 3px, rgba(0, 243, 255, 0.02) 3px);
    }

    /* Fuentes personalizadas */
    .font-title { font-family: 'Orbitron', sans-serif; }
    .font-mono-tech { font-family: 'Share Tech Mono', monospace; }

    /* Bordes biselados Cyberpunk */
    .cyber-card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 243, 255, 0.3);
      clip-path: polygon(
        0 0, 
        calc(100% - 20px) 0, 
        100% 20px, 
        100% 100%, 
        20px 100%, 
        0 calc(100% - 20px)
      );
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.1);
      position: relative;
    }

    /* Efectos Neón Glow */
    .glow-cyan {
      text-shadow: 0 0 8px var(--neon-cyan), 0 0 20px rgba(0, 243, 255, 0.6);
    }
    .glow-magenta {
      text-shadow: 0 0 8px var(--neon-magenta), 0 0 20px rgba(255, 0, 85, 0.6);
    }

    /* Input Cyberpunk */
    .cyber-input {
      background: rgba(5, 8, 15, 0.9);
      border: 1px solid rgba(0, 243, 255, 0.4);
      color: var(--neon-cyan);
      font-family: 'Share Tech Mono', monospace;
      transition: all 0.2s ease-in-out;
    }
    .cyber-input:focus {
      outline: none;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.5);
      background: rgba(0, 243, 255, 0.05);
    }

    /* Botón Cyberpunk */
    .cyber-btn {
      background: linear-gradient(135deg, var(--neon-cyan) 0%, #0088cc 100%);
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
      transition: all 0.2s ease;
      position: relative;
    }
    .cyber-btn:hover {
      background: var(--neon-yellow);
      box-shadow: 0 0 20px var(--neon-yellow);
      transform: translateY(-2px);
    }

    /* Selector de Rol */
    .role-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }
    .role-btn.active-player {
      border-color: var(--neon-cyan);
      background: rgba(0, 243, 255, 0.15);
      color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }
    .role-btn.active-gm {
      border-color: var(--neon-magenta);
      background: rgba(255, 0, 85, 0.15);
      color: var(--neon-magenta);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
    }

    /* Grid de fondo decorativo */
    .bg-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-grid relative">

  <!-- Elemento de escaneo óptico superpuesto -->
  <div class="absolute inset-0 pointer-events-none opacity-20 bg-[radial-gradient(#00f3ff_1px,transparent_1px)] [background-size:16px_16px]"></div>

  <div class="w-full max-w-md relative z-10">
    
    <!-- Encabezado del Portal -->
    <div class="text-center mb-6">
      <div class="inline-block px-3 py-1 bg-cyan-950/60 border border-cyan-500/30 text-cyan-400 font-mono-tech text-xs tracking-widest mb-2">
        // SYSTEM VER: 2.0.77 // SECURE CONNECTION
      </div>
      <h1 class="text-4xl font-black font-title tracking-wider text-white glow-cyan">
        NETRUNNER<span class="text-cyan-400">.</span>OS
      </h1>
      <p class="text-gray-400 font-mono-tech text-xs uppercase tracking-widest mt-1">
        Portal de Acceso a Sesión Cyberpunk RPG
      </p>
    </div>

    <!-- Tarjeta de Login -->
    <div class="cyber-card p-8">
      
      <!-- Selector de Rol -->
      <div class="mb-6">
        <label class="block font-mono-tech text-xs text-gray-400 uppercase tracking-wider mb-2">// Seleccionar Rol de Acceso</label>
        <div class="grid grid-cols-2 gap-3">
          <button type="button" id="btn-player" class="role-btn active-player py-2 text-sm font-title font-bold uppercase rounded-none transition">
            [ Jugador ]
          </button>
          <button type="button" id="btn-gm" class="role-btn py-2 text-sm font-title font-bold uppercase rounded-none transition">
            [ Game Master ]
          </button>
        </div>
      </div>

      <!-- Formulario de Inicio de Sesión -->
      <form id="login-form" onsubmit="event.preventDefault(); alert('Iniciando sesión...');">
        
        <!-- Campo: Usuario / Handle -->
        <div class="mb-5">
          <label for="username" class="block font-mono-tech text-xs text-cyan-400 uppercase tracking-wider mb-1">
            &gt; Handle / Usuario Neuronal
          </label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="ej: V_Vanguard_99" 
            required 
            class="cyber-input w-full px-4 py-3 text-sm"
          >
        </div>

        <!-- Campo: Clave / Password -->
        <div class="mb-6">
          <label for="password" class="block font-mono-tech text-xs text-cyan-400 uppercase tracking-wider mb-1">
            &gt; Encriptación / Passcode
          </label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••••••" 
            required 
            class="cyber-input w-full px-4 py-3 text-sm"
          >
        </div>

        <!-- Recordar Sesión / Link Olvidado -->
        <div class="flex items-center justify-between font-mono-tech text-xs mb-6 text-gray-400">
          <label class="flex items-center cursor-pointer hover:text-cyan-400">
            <input type="checkbox" class="accent-cyan-400 mr-2"> Recordar Credenciales
          </label>
          <a href="#" class="hover:text-cyan-400 transition">// Clave Olvidada?</a>
        </div>

        <!-- Botón de Entrar -->
        <button type="submit" class="cyber-btn w-full py-4 text-center tracking-widest text-base uppercase">
          [ Conectar a la Red ]
        </button>

      </form>

      <!-- Pie de Tarjeta / Redirección a Registro -->
      <div class="mt-6 pt-6 border-t border-cyan-500/20 text-center">
        <p class="font-mono-tech text-xs text-gray-400">
          ¿No posees una ID Registrada?
        </p>
        <a href="register.html" class="inline-block mt-2 text-sm font-title font-bold text-pink-500 hover:text-pink-400 glow-magenta transition uppercase tracking-wider">
          &gt; Crear Nuevo Registro de Netrunner &lt;
        </a>
      </div>

    </div>

    <!-- Indicador de Estado del Sistema -->
    <div class="mt-4 flex items-center justify-between text-xs font-mono-tech text-gray-500 px-2">
      <span class="flex items-center">
        <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse mr-2"></span>
        SERVIDORES: ONLINE
      </span>
      <span>PING: 14ms</span>
    </div>

  </div>

  <script>
    // Lógica para alternar la selección visual del Rol (Jugador / GM)
    const btnPlayer = document.getElementById('btn-player');
    const btnGm = document.getElementById('btn-gm');

    btnPlayer.addEventListener('click', () => {
      btnPlayer.classList.add('active-player');
      btnGm.classList.remove('active-gm');
    });

    btnGm.addEventListener('click', () => {
      btnGm.classList.add('active-gm');
      btnPlayer.classList.remove('active-player');
    });
  </script>

</body>
</html>
