<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERPUNK RPG - ACCESO AL SISTEMA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #050508; font-family: 'Rajdhani', sans-serif; color: #e2e8f0; }
    .font-title { font-family: 'Orbitron', sans-serif; }
    .cyber-box { background: rgba(10, 15, 25, 0.9); border: 1px solid rgba(0, 243, 255, 0.3); }
    .cyber-input { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 243, 255, 0.4); color: #00f3ff; }
    .cyber-input:focus { border-color: #fcee0a; outline: none; }
    .cyber-btn { background: #00f3ff; color: #000; font-family: 'Orbitron', sans-serif; font-weight: 700; transition: all 0.2s; }
    .cyber-btn:hover { background: #fcee0a; box-shadow: 0 0 15px rgba(252, 238, 10, 0.5); }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="cyber-box p-8 rounded-lg max-w-md w-full shadow-2xl relative">
    <div class="absolute top-0 left-0 w-2 h-2 bg-cyan-400"></div>
    <div class="absolute top-0 right-0 w-2 h-2 bg-cyan-400"></div>
    <div class="absolute bottom-0 left-0 w-2 h-2 bg-cyan-400"></div>
    <div class="absolute bottom-0 right-0 w-2 h-2 bg-cyan-400"></div>

    <h1 class="font-title text-2xl text-center text-cyan-400 mb-2 tracking-wider">NET_ACCESS // LOGIN</h1>
    <p class="text-xs text-center text-gray-400 mb-6 font-mono">AUTENTICACIÓN DE NETRUNNER</p>

    <!-- Pestañas -->
    <div class="flex mb-6 border-b border-cyan-500/30">
      <button id="tab-login" onclick="cambiarTab('login')" class="flex-1 pb-2 font-title text-sm text-cyan-400 border-b-2 border-cyan-400">INICIAR SESIÓN</button>
      <button id="tab-registro" onclick="cambiarTab('registro')" class="flex-1 pb-2 font-title text-sm text-gray-500">REGISTRO</button>
    </div>

    <!-- Alerta de mensajes -->
    <div id="mensaje-alerta" class="hidden p-3 mb-4 text-xs font-mono rounded border"></div>

    <!-- FORMULARIO LOGIN -->
    <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-title text-gray-400 mb-1">USUARIO O EMAIL</label>
        <input type="text" id="login-user" required class="cyber-input w-full p-3 rounded text-sm">
      </div>
      <div>
        <label class="block text-xs font-title text-gray-400 mb-1">CONTRASEÑA</label>
        <input type="password" id="login-pass" required class="cyber-input w-full p-3 rounded text-sm">
      </div>
      <button type="submit" class="cyber-btn w-full py-3 rounded text-sm tracking-widest mt-2">ACCEDER AL SISTEMA</button>
    </form>

    <!-- FORMULARIO REGISTRO -->
    <form id="form-registro" onsubmit="handleRegistro(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-title text-gray-400 mb-1">NOMBRE DE USUARIO</label>
        <input type="text" id="reg-user" required class="cyber-input w-full p-3 rounded text-sm">
      </div>
      <div>
        <label class="block text-xs font-title text-gray-400 mb-1">CORREO ELECTRÓNICO</label>
        <input type="email" id="reg-email" required class="cyber-input w-full p-3 rounded text-sm">
      </div>
      <div>
        <label class="block text-xs font-title text-gray-400 mb-1">CONTRASEÑA</label>
        <input type="password" id="reg-pass" required class="cyber-input w-full p-3 rounded text-sm">
      </div>
      <button type="submit" class="cyber-btn w-full py-3 rounded text-sm tracking-widest mt-2">REGISTRAR CUENTA</button>
    </form>
  </div>

  <script>
    function cambiarTab(tipo) {
      const fLogin = document.getElementById('form-login');
      const fReg = document.getElementById('form-registro');
      const tLogin = document.getElementById('tab-login');
      const tReg = document.getElementById('tab-registro');
      const alerta = document.getElementById('mensaje-alerta');
      alerta.classList.add('hidden');

      if (tipo === 'login') {
        fLogin.classList.remove('hidden');
        fReg.classList.add('hidden');
        tLogin.className = "flex-1 pb-2 font-title text-sm text-cyan-400 border-b-2 border-cyan-400";
        tReg.className = "flex-1 pb-2 font-title text-sm text-gray-500";
      } else {
        fLogin.classList.add('hidden');
        fReg.classList.remove('hidden');
        tReg.className = "flex-1 pb-2 font-title text-sm text-cyan-400 border-b-2 border-cyan-400";
        tLogin.className = "flex-1 pb-2 font-title text-sm text-gray-500";
      }
    }

    function mostrarAlerta(texto, esError = true) {
      const alerta = document.getElementById('mensaje-alerta');
      alerta.textContent = texto;
      alerta.className = `p-3 mb-4 text-xs font-mono rounded border ${esError ? 'bg-red-950/80 border-red-500 text-red-300' : 'bg-cyan-950/80 border-cyan-500 text-cyan-300'}`;
      alerta.classList.remove('hidden');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username_or_email = document.getElementById('login-user').value.trim();
      const password = document.getElementById('login-pass').value;

      try {
        const res = await fetch(`${window.location.origin}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username_or_email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('usuario', JSON.stringify(data.usuario));
          window.location.href = 'index.html';
        } else {
          mostrarAlerta(data.message);
        }
      } catch (err) {
        mostrarAlerta("Error de conexión con el servidor central.");
      }
    }

    async function handleRegistro(e) {
      e.preventDefault();
      const username = document.getElementById('reg-user').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-pass').value;

      try {
        const res = await fetch(`${window.location.origin}/api/auth/registro`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();

        if (res.ok) {
          mostrarAlerta("¡Registro exitoso! Ya puedes iniciar sesión.", false);
          cambiarTab('login');
        } else {
          mostrarAlerta(data.message);
        }
      } catch (err) {
        mostrarAlerta("Error de conexión con el servidor central.");
      }
    }
  </script>
</body>
</html>
